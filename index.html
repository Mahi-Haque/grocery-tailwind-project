<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind HomeWork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/output.css">
</head>
<body>
    <div class="py-10 bg-[url('/images/background.png')] bg-cover bg-center bg-no-repeat">
        <div class="max-w-330 mx-auto flex justify-between items-center">
            <img src="images/logo.png" alt="logo.png">
            <ul class="flex justify-between gap-2 text-white font-mahi text-[20px]">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">Home</a></li>
            </ul>
            <img src="images/cart.png" alt="cart.png">
        </div>
        <div class="max-w-330 mx-auto flex justify-between items-center">
            <div class="text-white">
                <h1 class="max-w-330 text-5xl mb-5 font-bold">Groceries <br> deliver in <span>15 mins</span></h1>
                <p>Grocify offer a wide range of products, including fresh products, meats,<br> dairy, baked good and non-perishable items.
                </p>
                <div class="mt-4 flex gap-x-5 items-center">
                    <a href="#" class="bg-amber-400 px-10 py-2 rounded-3xl mt-2">Order now</a> 
                    <a href="#" class="bg-red-400 px-10 py-2 rounded-3xl mt-2">Download App</a> 
                </div>
            </div>
            <img class="w-1/2" src="images/grocery-image.png" alt="">
        </div>
    </div>
</body>
</html>
